name: notebooks

on:
  push:
    paths:
      - "examples/**"
      - "o25/**"
      - "requirements-examples.txt"
      - ".github/workflows/notebooks.yml"

  pull_request:
    paths:
      - "examples/**"
      - "o25/**"
      - "requirements-examples.txt"
      - ".github/workflows/notebooks.yml"

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install O25 and notebook tools
        run: |
          python -m pip install .
          python -m pip install -r requirements-examples.txt
          python -m pip install nbconvert

      - name: Create temporary output directory
        run: mkdir -p /tmp/o25-notebooks

      - name: Execute quick-start notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute examples/01_quickstart.ipynb \
            --output-dir /tmp/o25-notebooks \
            --ExecutePreprocessor.timeout=300

      - name: Execute hyperspectral notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute examples/02_files_and_hyperspectral_data.ipynb \
            --output-dir /tmp/o25-notebooks \
            --ExecutePreprocessor.timeout=300

      - name: Execute multiple-spectra notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute examples/03_multiple_spectra.ipynb \
            --output-dir /tmp/o25-notebooks \
            --ExecutePreprocessor.timeout=300
