[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "o25"
version = "0.2.0"
description = "O25 bidirectional correction and BH4 uncertainty for aquatic remote sensing"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jaime Pitarch", email = "jaime.pitarch@cnr.it" }]
dependencies = ["numpy>=1.26", "scipy>=1.11"]
classifiers = [
 "Programming Language :: Python :: 3",
 "Programming Language :: Python :: 3.10",
 "Programming Language :: Python :: 3.11",
 "Programming Language :: Python :: 3.12",
 "Programming Language :: Python :: 3.13",
 "Operating System :: OS Independent"]
[project.urls]
Homepage = "https://github.com/jaipipor/O25"
Repository = "https://github.com/jaipipor/O25"
Issues = "https://github.com/jaipipor/O25/issues"
[tool.setuptools.packages.find]
include = ["o25*"]
[tool.setuptools.package-data]
o25 = ["data/o25/*.txt", "data/bh4/*.mat"]
