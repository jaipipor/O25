name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: pytest -q
  notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install O25 and notebook dependencies
        run: |
          python -m pip install .
          python -m pip install -r requirements-examples.txt

      - name: Execute notebooks
        run: |
          jupyter execute examples/01_quickstart.ipynb
          jupyter execute examples/02_files_and_hyperspectral_data.ipynb
          jupyter execute examples/03_multiple_spectra.ipynb